<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>知识库管理 · 公司知识助手</title>
<style>
:root {
  --bg-page: #f5f5f7;
  --bg-sidebar: #f9f9fb;
  --bg-card: #ffffff;
  --bg-hover: #f1f3f7;
  --bg-active: #e8f1fc;
  --border: #e6e8ec;
  --border-light: #eef0f3;
  --text: #1c1c1e;
  --text-sec: #5f6470;
  --text-muted: #9aa0aa;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-light: rgba(37,99,235,0.08);
  --danger: #dc2626;
  --danger-hover: #b91c1c;
  --success: #16a34a;
  --warning: #d97706;
  --shadow-sm: 0 1px 2px rgba(20,24,35,0.04);
  --shadow: 0 1px 3px rgba(20,24,35,0.06), 0 1px 2px rgba(20,24,35,0.04);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 18px;
  --transition: 0.2s ease;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: var(--bg-page); color: var(--text); -webkit-font-smoothing: antialiased;
  display:flex; min-height:100vh;
}
.sidebar {
  width: 260px; min-width: 260px; background: var(--bg-sidebar);
  border-right: 1px solid var(--border); display:flex; flex-direction:column;
}
.sidebar-header { padding: 16px 14px 10px 14px; }
.sidebar-logo {
  display:flex; align-items:center; gap:10px; padding:4px 2px 2px 2px;
}
.sidebar-logo .logo-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #fbbf77, #fdba74);
  display:flex; align-items:center; justify-content:center; font-size: 15px;
  flex-shrink: 0;
}
.sidebar-logo .logo-text { font-size: 15px; font-weight: 600; color: var(--text); }
.sidebar-nav { flex:1; padding: 12px 8px; display:flex; flex-direction:column; gap: 2px; }
.nav-item {
  display:flex; align-items:center; gap: 10px; padding: 10px 12px;
  border-radius: var(--radius-sm); font-size: 14px; color: var(--text-sec);
  text-decoration: none; cursor: pointer; transition: all var(--transition);
}
.nav-item:hover { background: var(--bg-hover); color: var(--text) }
.nav-item.active { background: var(--bg-active); color: var(--accent); font-weight: 500 }
.nav-item svg { flex-shrink: 0; opacity: 0.6 }
.nav-item.active svg { opacity: 1 }
.sidebar-footer {
  border-top: 1px solid var(--border-light); padding: 12px 14px; font-size: 11px;
  color: var(--text-muted); line-height: 1.6; display:flex; flex-direction:column; gap: 4px;
}
.sidebar-footer a { color: var(--text-muted); text-decoration:none; }
.sidebar-footer a:hover { color: var(--danger) }
.main { flex:1; display:flex; flex-direction:column; min-width:0; overflow-y:auto }
.page-header {
  padding: 28px 32px 20px 32px; border-bottom: 1px solid var(--border-light);
}
.page-header h1 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 4px }
.page-header p { font-size: 13px; color: var(--text-sec) }
.page-body { padding: 24px 32px; max-width: 960px }

.toolbar {
  display:flex; align-items:center; gap: 12px; margin-bottom: 20px;
  flex-wrap: wrap;
}
.btn {
  border: none; border-radius: var(--radius-sm); padding: 8px 18px;
  font-size: 13px; cursor: pointer; font-weight: 500; transition: all var(--transition);
  display:flex; align-items:center; gap: 6px; white-space: nowrap;
  font-family: inherit;
}
.btn-pri { background: var(--accent); color: #fff; }
.btn-pri:hover { background: var(--accent-hover); }
.btn-pri:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sec { background: var(--bg-card); color: var(--accent); border: 1px solid var(--border); }
.btn-sec:hover { background: var(--accent-light); border-color: var(--accent); }
.btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--border); }
.btn-danger:hover { background: rgba(220,38,38,0.06); border-color: var(--danger); }

.upload-zone {
  position: relative;
}
.upload-zone input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
}

.doc-table {
  width: 100%; border-collapse: collapse;
  background: var(--bg-card); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
}
.doc-table th, .doc-table td {
  padding: 12px 16px; text-align: left; font-size: 13px;
}
.doc-table th {
  background: var(--bg-sidebar); color: var(--text-sec); font-weight: 500;
  font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.doc-table tr:not(:last-child) td { border-bottom: 1px solid var(--border-light) }
.doc-table td {
  color: var(--text); vertical-align: middle;
}
.doc-table tr:hover td { background: var(--bg-hover) }
.doc-name { font-weight: 500; max-width: 280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.doc-type {
  display:inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px;
  font-weight: 500; background: var(--bg-hover); color: var(--text-sec);
  text-transform: uppercase;
}
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5 }
.empty-state p { font-size: 14px }

.toast {
  position: fixed; top: 20px; right: 20px; padding: 12px 20px;
  border-radius: var(--radius-sm); font-size: 13px; z-index: 1000;
  opacity: 0; transform: translateY(-8px); transition: all 0.3s ease;
  pointer-events: none; box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateY(0) }
.toast.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0 }
.toast.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca }
.toast.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a }

.progress-bar {
  height: 4px; background: var(--border); border-radius: 2px; margin-top: 16px;
  overflow: hidden; display: none;
}
.progress-bar.active { display: block }
.progress-bar .fill {
  height: 100%; background: var(--accent); border-radius: 2px;
  animation: progressPulse 1.5s ease-in-out infinite;
}
@keyframes progressPulse {
  0%, 100% { width: 20%; margin-left: 0 }
  50% { width: 60%; margin-left: 20% }
}

.rebuild-result {
  margin-top: 16px; padding: 14px 16px; border-radius: var(--radius-sm);
  font-size: 13px; line-height: 1.6; display: none;
  background: var(--bg-card); border: 1px solid var(--border);
}
.rebuild-result.show { display: block }
.rebuild-result .result-icon { font-size: 20px; margin-bottom: 6px }

@media (max-width: 768px) {
  .sidebar { display: none }
  .page-header { padding: 20px 16px }
  .page-body { padding: 16px }
  .doc-table { font-size: 12px }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <span class="logo-icon">📋</span>
      <span class="logo-text">公司知识助手</span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a href="/chat" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      💬 智能问答
    </a>
    <a href="/kb" class="nav-item active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      📁 知识库管理
    </a>
  </nav>
  <div class="sidebar-footer">
    <a href="/logout">退出登录</a>
  </div>
</aside>

<div class="main">
  <div class="page-header">
    <h1>📁 知识库管理</h1>
    <p>上传、管理企业知识文档，并重建检索索引</p>
  </div>
  <div class="page-body">
    <div class="toolbar">
      <label class="btn btn-pri upload-zone">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        上传文档
        <input type="file" id="fileInput" accept=".pdf,.docx,.doc" onchange="handleUpload()">
      </label>
      <button class="btn btn-sec" onclick="refreshList()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        刷新列表
      </button>
      <button class="btn btn-danger" onclick="handleRebuild()" id="rebuildBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        重建索引
      </button>
    </div>

    <div class="progress-bar" id="progressBar"><div class="fill"></div></div>

    <div class="rebuild-result" id="rebuildResult"></div>

    <div id="docTableContainer">
      <table class="doc-table" id="docTable">
        <thead><tr><th>文档名称</th><th>类型</th><th>大小</th><th>上传时间</th><th>操作</th></tr></thead>
        <tbody id="docTbody"></tbody>
      </table>
    </div>

    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">📂</div>
      <p>知识库暂无文档</p>
      <p style="font-size:12px;margin-top:4px;color:var(--text-muted)">点击「上传文档」添加 .pdf / .docx / .doc 文件</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);

let toastTimer = null;
function showToast(msg, type) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast ' + type + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show') }, 3000);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function api(path, opts={}) {
  try {
    const r = await fetch(path, { credentials: 'same-origin', ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } });
    if (r.status === 401) { window.location.href = '/login'; return null }
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || '请求失败') }
    return await r.json();
  } catch(e) { throw e }
}

function formatTime(dateStr) {
  try {
    const d = new Date(dateStr);
    return d.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch(e) { return dateStr }
}

async function refreshList() {
  try {
    const docs = await api('/api/kb/list');
    if (!docs) return;
    const tbody = $('#docTbody');
    const empty = $('#emptyState');
    if (docs.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = docs.map(d => `
      <tr>
        <td><span class="doc-name" title="${escHtml(d.name)}">${escHtml(d.name)}</span></td>
        <td><span class="doc-type">${escHtml(d.type)}</span></td>
        <td>${escHtml(d.size)}</td>
        <td>${formatTime(d.modified)}</td>
        <td>
          <button class="btn btn-danger" style="padding:4px 12px;font-size:12px" onclick="handleDelete('${escHtml(d.name)}')">删除</button>
        </td>
      </tr>
    `).join('');
  } catch(e) {
    showToast('加载失败: ' + e.message, 'err');
  }
}

async function handleUpload() {
  const input = $('#fileInput');
  const file = input.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);

  try {
    const r = await fetch('/api/kb/upload', { method: 'POST', credentials: 'same-origin', body: formData });
    if (r.status === 401) { window.location.href = '/login'; return }
    const d = await r.json();
    if (r.ok) {
      showToast(`✅ ${file.name} 上传成功`, 'ok');
      refreshList();
    } else {
      showToast(d.detail || '上传失败', 'err');
    }
  } catch(e) {
    showToast('上传失败: ' + e.message, 'err');
  }
  input.value = '';
}

async function handleDelete(filename) {
  if (!confirm(`确认删除「${filename}」？`)) return;
  try {
    await api('/api/kb/delete', { method: 'DELETE', body: JSON.stringify({ filename }) });
    showToast(`已删除 ${filename}`, 'ok');
    refreshList();
  } catch(e) {
    showToast('删除失败: ' + e.message, 'err');
  }
}

async function handleRebuild() {
  if (!confirm('重建索引将重新解析所有文档并构建向量库 + BM25 索引，可能需要几分钟时间。确认继续？')) return;

  const btn = $('#rebuildBtn');
  btn.disabled = true;
  btn.textContent = '⌛ 重建中...';
  const bar = $('#progressBar');
  bar.classList.add('active');
  $('#rebuildResult').classList.remove('show');

  try {
    const result = await api('/api/kb/rebuild', { method: 'POST' });
    bar.classList.remove('active');
    btn.disabled = false;
    btn.textContent = '重建索引';
    if (result) {
      $('#rebuildResult').innerHTML = `
        <div class="result-icon">✅</div>
        索引重建完成：<strong>${result.documents}</strong> 篇文档 → <strong>${result.chunks}</strong> 个文本块
      `;
      $('#rebuildResult').classList.add('show');
      showToast(`索引重建完成：${result.documents} 篇文档, ${result.chunks} 个 chunks`, 'ok');
    }
  } catch(e) {
    bar.classList.remove('active');
    btn.disabled = false;
    btn.textContent = '重建索引';
    showToast('重建失败: ' + e.message, 'err');
    $('#rebuildResult').innerHTML = `<div class="result-icon">❌</div>重建失败: ${escHtml(e.message)}`;
    $('#rebuildResult').classList.add('show');
  }
}

refreshList();
</script>
</body>
</html>
